backend:
  name: github
  repo: cessuofk/official-website
  branch: main
  base_url: https://cms-auth.develtio.com # Or your chosen gateway base URL
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "board_members"
    label: "Board Members"
    folder: "content/board"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "ID", name: "id", widget: "string"}
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Role", name: "role", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["Executive", "Secretariat", "Council", "Honorary"]}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Scope", name: "scope", widget: "text", required: false}
